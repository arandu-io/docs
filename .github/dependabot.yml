# One ecosystem: the actions the workflows pin. There is no Go module in this
# repository, and there is no npm entry anywhere in this project -- nothing in
# any of these repositories installs Node.
#
# There is no workflow here yet either, so this entry watches nothing today. It
# is declared anyway: the day a workflow lands, the pin is already covered
# rather than covered later by somebody who remembers.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
