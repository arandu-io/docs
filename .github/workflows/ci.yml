name: ci

# The repository is the usage documentation, the standard-library Go commands
# that verify it, and the archive of decisions. CI tests those commands,
# resolves the links, compiles every Go example against the published tags, and
# keeps the archive frozen.

on:
  push:
    branches: [main, "0.x"]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod declares the minimum language version. CI uses the current
          # stable patch release so vulnerability scanning does not fail on a
          # standard-library issue already fixed in a later patch.
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(find . -name '*.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: GOWORK=off go build ./...

      - name: vet
        run: GOWORK=off go vet ./...

      - name: test
        run: GOWORK=off go test -race ./...

      - name: links resolve
        run: GOWORK=off go run ./cmd/check-links

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOWORK=off govulncheck ./...

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Every fenced block marked "go example" in en/ is written into a module
      # that requires the tags in versions.json, then vetted and built, and
      # tested when it declares a test. The pt/ and es/ pages must carry the
      # same anchors and the same blocks. An example that does not compile
      # fails the job with the Markdown file and line.
      - name: examples compile against the published tags
        run: GOWORK=off go run ./cmd/prove-examples

  frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The comparison needs the commit the push or the pull request
          # started from. A shallow checkout does not have it, and the step
          # would then find no change and pass -- which is the failure mode
          # this job exists to avoid.
          fetch-depth: 0

      # _archive/ holds the numbered documents, the old ADRs and the package
      # notes as they stood when they were archived. They are frozen: a
      # correction to one of them is a correction to the record of a decision
      # that was already taken, and the note that supersedes it lives in the
      # vault instead.
      #
      # Deleting one is allowed and removing the whole directory is planned, so
      # this looks for a file that was edited or renamed, not for one that went
      # away.
      - name: _archive/ was not edited
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare against; nothing to check."
            exit 0
          fi

          edited="$(git diff --name-only --diff-filter=MR "$BASE" "$HEAD" -- _archive/)"
          if [ -n "$edited" ]; then
            echo "::error::these archived files were edited:"
            echo "$edited"
            echo
            echo "_archive/ is the record as it stood when it was archived."
            echo "Correct the note that supersedes the document instead, and"
            echo "leave the archived copy saying what it said."
            exit 1
          fi
          echo "_archive/ untouched."
